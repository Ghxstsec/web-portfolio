baseURL = "https://soyjoel.com/"
languageCode = "es-es"
theme = "hugo-winston-theme"
themesDir = "themes"
title = "Ghxstsec | Portfolio de Ciberseguridad"

[pagination]
pagerSize = 5


[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"
 
[params]
  google_analytics_id = ""
  twitter_handle = "@Louikizz"
  showAuthorOnHomepage = false
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  showReadTimeOnPosts = true
  usePaginationOnHomepage = false
  limitPostsOnHomepage = 6
  sortPostsByDateOldestFirst = false
  addDot = true
  addFrame = false
  enableGoogleFonts = true
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
  description = "Portfolio de ciberseguridad de Ghxstsec: writeups de HackTheBox y DockerLabs, apuntes de Active Directory y certificaciones."
  showAboutPage = true
  github_username = "Ghxstsec"
  kofi_username = ""
  discord_invite = ""
  email = "contacto@ghxstsec.com"
  repo_name = "web-portfolio"
  footer_text = "Ghxstsec"
  footer_year = "2024-2026"

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
      xhtml = false

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Inicio'
    url = '/'
    weight = 1
  [[menu.main]]
    name = "Writeups"
    identifier = "writeups"
    weight = 2
    url = "/writeups/"
  [[menu.main]]
    name = "Blog"
    identifier = "blog"
    weight = 3
    url = "/blog/"
  [[menu.main]]
    name = "Certificaciones"
    identifier = "certs"
    weight = 4
    url = "/certificaciones/"